<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>랜덤채팅은 릴챗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="chat-container">
      <div class="nickname-box">
          <label for="nickname">닉네임</label>
          <input type="text" id="nickname" class="nickname-input" placeholder="Enter your name" maxlength="15">
          <a class="x-button" href="/">❌</a>
      </div>
      <div class="chat-box">
        <div class="user-number">🌐</div>
        <ul class="chat-ul">
        </ul>
      </div>
      <div class="text-box">
        <form action="">
          <input type="text" class="text-input" placeholder="Enter a message" />
          <button class="send-button" type="submit">전송</button>
        </form>
      </div>
    </div>
    
  
  <script src="/js/client.js"></script>
</body>
</html>
